# =============================================================================
# openresty / nginx — desastres.carminati.dev.br
#
# ATENCAO ANTES DE INSTALAR ISTO. A VPS srv1522378 responde com `Server:
# openresty` e serve uma pagina "Default Site", o que indica um painel
# gerenciando a configuracao (CyberPanel e Hostinger usam openresty e geram os
# vhosts). SE FOR O CASO, um arquivo escrito a mao aqui e SOBRESCRITO na
# proxima alteracao pelo painel, e o site cai sem ninguem ter mexido nele.
#
# MEDIR PRIMEIRO, com estes comandos de leitura:
#
#     nginx -V 2>&1 | head -1
#     ls -la /usr/local/lsws/conf/vhosts/ 2>/dev/null     # CyberPanel/OLS
#     ls -la /usr/local/openresty/nginx/conf/conf.d/ 2>/dev/null
#     ls -la /etc/nginx/sites-enabled/ 2>/dev/null
#     nginx -T 2>/dev/null | grep -c server_name
#
# Havendo painel, o vhost se cria PELO PAINEL e so o bloco `location /` abaixo
# e colado no campo de configuracao personalizada dele. Sem painel, este
# arquivo vale inteiro.
#
# HTTPS TEM DE SAIR DAQUI. O Cloudflare esta em "DNS only" — ele so resolve o
# nome e nao termina TLS. Medido em 03/09/2026: a porta 443 do dominio NAO
# responde (`http=000`). O certificado vem do Let's Encrypt nesta maquina.
# =============================================================================

# ------------------------------------------------------------------ porta 80
server {
    listen 80;
    listen [::]:80;
    server_name desastres.carminati.dev.br;

    # O DESAFIO DO LET'S ENCRYPT FICA ANTES DO REDIRECIONAMENTO. Um `return 301`
    # que engole tudo faz a renovacao falhar — e ela e automatica, entao a
    # descoberta vem noventa dias depois, com o certificado expirado e o site
    # inacessivel. Este bloco e a razao de a porta 80 continuar existindo.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------- porta 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name desastres.carminati.dev.br;

    # Estes dois caminhos sao os que o certbot cria. ELES AINDA NAO EXISTEM:
    # instalar este arquivo antes de emitir o certificado impede o nginx de
    # recarregar, e um `nginx -s reload` que falha deixa a configuracao ANTIGA
    # no ar — o que e uma sorte, nao um plano. Emitir primeiro:
    #
    #     certbot certonly --webroot -w /var/www/html \
    #             -d desastres.carminati.dev.br
    ssl_certificate     /etc/letsencrypt/live/desastres.carminati.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desastres.carminati.dev.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ------------------------------------------------------- cabecalhos
    # HSTS SEM `includeSubDomains` e SEM `preload`, de proposito. O dominio
    # `carminati.dev.br` tem outros subdominios nesta maquina, e um deles em
    # HTTP puro ficaria inacessivel para quem visitasse este primeiro — o
    # navegador passaria a exigir HTTPS de TODOS. `preload` e pior: entra numa
    # lista embutida nos navegadores e sair dela leva meses.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `SAMEORIGIN` e nao `DENY`: a documentacao usa iframe de sondagem em
    # desenvolvimento, e `DENY` tambem impediria a previa em ferramentas
    # legitimas do proprio dominio.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # O tamanho maximo de corpo. A aplicacao nao recebe upload nenhum — o
    # formulario de alerta manda um CEP e um e-mail. 64k e folgado e fecha a
    # porta para quem tentar empurrar megabytes num POST.
    client_max_body_size 64k;

    # -------------------------------------------------------- a aplicacao
    location / {
        # 127.0.0.1 e nao 0.0.0.0: a aplicacao escuta so no laco local
        # (`%prod.quarkus.http.host=127.0.0.1`), entao ela e inalcancavel de
        # fora por construcao, e nao por regra de firewall que se perde.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # ESTES QUATRO CABECALHOS SAO O CONTRATO com
        # `quarkus.http.proxy.proxy-address-forwarding=true`. Sem eles, a
        # aplicacao ve toda requisicao vindo de 127.0.0.1 em `http`: a
        # telemetria registra o proxy como cliente de tudo, e qualquer
        # redirecionamento que o framework monte sai apontando para
        # `http://127.0.0.1:8080`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A sincronizacao com a EONET pode passar de um minuto em rede ruim, e
        # o padrao de 60s cortaria a resposta no meio deixando o cliente com
        # 504 sobre uma operacao que terminou bem no servidor.
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # HTMX faz pedidos parciais; buffer ligado e o certo aqui (as respostas
        # sao pequenas e completas), mas o `proxy_buffering` precisa ficar
        # explicito para nao depender do padrao do painel.
        proxy_buffering on;
    }

    # -------------------------------------------- estatico com cache longo
    # `?v=<carimbo>` acompanha cada asset, e o carimbo muda a cada build. Isso
    # e o que torna `immutable` seguro: a URL de uma versao nova e OUTRA URL,
    # entao nao ha cache velho para invalidar.
    location /estatico/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ------------------------------------------------------ o que nao entra
    # A telemetria mede o funcionamento interno e nao e publica. O
    # `robots.txt` ja pede que nao seja indexada — mas robots.txt e um PEDIDO,
    # nao uma tranca, e rastreador mal-intencionado nao obedece. Enquanto o
    # login do GitHub nao existir, quem barra e esta linha.
    #
    # 404 e nao 403: `403` confirma que a rota EXISTE e esta protegida, o que e
    # informacao para quem procura superficie. `404` nao diz nada.
    location /telemetria {
        return 404;
    }

    access_log /var/log/nginx/desastres.access.log;
    error_log  /var/log/nginx/desastres.error.log;
}
