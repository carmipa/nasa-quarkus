plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-arc'

    // Camada web: Qute renderiza no servidor, HTMX troca pedaco de tela.
    // Regua §6.1 da planta: ha banco e ha pagina derivada do estado do servidor
    // => linha 1 (Qute + HTMX), nao SPA.
    implementation 'io.quarkus:quarkus-rest-qute'

    // --- SQLite (item 1 do docs/PLANO-MESTRE.md) -----------------------------
    // O SQLite NAO e extensao oficial do Quarkus: entra como driver JDBC comum
    // sob o pool Agroal, com `quarkus.datasource.db-kind=other`. A viabilidade
    // desta combinacao (Quarkus 3.39.1 + Java 25 + SQLite) e medida por
    // SqliteViabilidadeTest antes de qualquer coisa ser construida em cima.
    implementation 'io.quarkus:quarkus-agroal'
    // Scheduler: a telemetria acumula em memoria e DESCARREGA periodicamente.
    // Gravar uma linha por operacao executada poria uma ida ao banco dentro de
    // cada chamada — telemetria e apoio, e apoio nao pode cobrar pedagio da
    // funcao que ele observa.
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'

    // Documentacao: Markdown renderizado NO SERVIDOR. A alternativa — montar no
    // navegador com `marked` — poria a interpretacao de texto do lado de quem le,
    // e um documento com HTML embutido viraria script executando na pagina.
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'

    // Guarda de fronteira arquitetural. O desenho de fatias/peers/kernel é intenção
    // até existir um teste que REPROVE o build quando alguém cruzar a fronteira:
    // um documento pode ser ignorado pela próxima IA, um teste vermelho não.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
}

group = 'org.nasa'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// O driver do SQLite carrega biblioteca nativa via `System.load`. No Java 25 isso
// gera aviso; a mensagem do próprio JDK diz que "restricted methods will be blocked
// in a future release unless native access is enabled" — ou seja, hoje é ruído e num
// JDK futuro vira falha de boot. Declarar o acesso agora custa uma linha e evita que
// a atualização do JDK derrube a aplicação sem ninguém entender por quê.
// ---------------------------------------------------------------------------
// CARIMBO DA EXECUÇÃO (§9.1 da planta canônica)
//
// Um arquivo de log por execução exige um nome único por execução, e ele é
// gerado AQUI, no lançamento — não pela aplicação, que já subiria com o handler
// de arquivo apontando para lugar nenhum.
//
// `-Dnasa.log.execucao=...` vindo de fora VENCE: é o que permite reproduzir uma
// execução antiga sem sobrescrever o log dela.
// ---------------------------------------------------------------------------
def carimboDaExecucao = providers.systemProperty('nasa.log.execucao')
        .orElse(new java.text.SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date()))

// ---------------------------------------------------------------------------
// UTC ENFORÇADO — mecanismo nomeado, não afirmação (ordem de Paulo, 2026-09-02)
//
// "UTC enforçado" precisa de MECANISMO, senão é intenção: a JVM adota o fuso do
// host, e a mesma linha de log sai `-03:00` aqui e `+00:00` no contêiner. Log de
// duas máquinas deixa de ser comparável, e a janela de "últimos N dias" erra por
// horas justamente na virada.
//
// Medido antes de corrigir: a linha saía `2026-09-02T08:55:36.032-03:00`.
// ---------------------------------------------------------------------------
def FUSO_UTC = '-Duser.timezone=UTC'

tasks.withType(Test).configureEach {
    // Banco de teste NOVO a cada execução. Sem isto o resultado depende do que
    // sobrou da rodada anterior — e teste cujo veredito depende do passado não
    // prova nada sobre o presente.
    doFirst {
        delete fileTree(dir: project.layout.buildDirectory.get(), includes: ['teste-nasa.db*'])
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED', FUSO_UTC
    // Propriedade de sistema não chega sozinha ao JVM de teste: precisa estar
    // nesta lista NOMINAL. É proposital, e a planta avisa (§12.3) — mas quando a
    // chave não chega, o teste tem de DIZER, não rodar calado.
    systemProperty 'nasa.log.execucao', "teste-${carimboDaExecucao.get()}"
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs FUSO_UTC
    systemProperty 'nasa.log.execucao', carimboDaExecucao.get()
}

// ---------------------------------------------------------------------------
// `quarkusDev` NAO e uma tarefa JavaExec: o bloco acima nao a alcanca.
//
// CORRECAO DE 02/09, e vale registrar o erro: eu escrevi aqui, primeiro, que UTC
// nao precisava vir ao dev porque "a hora e UTC por mecanismo no codigo". Isso e
// verdade para os `Instant` da aplicacao — e FALSO para o carimbo do log, que
// quem escreve e o framework de logging, usando o fuso padrao da JVM. Medido
// lado a lado no mesmo commit:
//
//     producao (jar, sem flag)   2026-09-02T09:06:13.599-03:00
//     teste    (com a flag)      2026-09-02T15:04:19.138Z
//
// A API respondia `criadoEm: ...T15:05:51Z` enquanto a linha de log do MESMO
// instante dizia `12:05:51-03:00`. Quem cruza os dois ve tres horas de diferenca
// e vai cacar um defeito de gravacao que nao existe.
//
// Tentativa descartada, com medicao: `%d{...}{UTC}` no formato do log. O JBoss
// LogManager nao aceita zona no `%d` — imprimiu o literal `{UTC}` e manteve o
// `-03:00`. Configuracao nao resolve; a flag e o unico caminho.
//
// E como flag se esquece — foi assim que este defeito nasceu — quem garante o
// invariante e a CatracaDeFusoUtc, que derruba o arranque se a JVM nao estiver
// em UTC. A flag e a conveniencia; a catraca e o mecanismo.
//
// O `--enable-native-access` conserta outra coisa: o driver do SQLite carrega a
// biblioteca nativa via `System.load`, e o Java 25 ja avisa que "restricted
// methods will be blocked in a future release". Quando bloquear, o SQLite nao
// carrega, e o modo dev seria o primeiro a parar.
//
// Escrito defensivamente: se a tarefa mudar de forma numa versao futura do
// plugin, o build AVISA em vez de aplicar nada calado.
// ---------------------------------------------------------------------------
tasks.matching { it.name == 'quarkusDev' }.configureEach { tarefa ->
    def flags = ['--enable-native-access=ALL-UNNAMED', FUSO_UTC]
    def prop = tarefa.hasProperty('jvmArgs') ? tarefa.jvmArgs : null
    if (prop instanceof org.gradle.api.provider.ListProperty) {
        prop.addAll(flags)
    } else if (prop instanceof List) {
        tarefa.jvmArgs = prop + flags
    } else {
        logger.warn("AVISO: nao consegui passar ${flags} ao quarkusDev " +
                    "(jvmArgs ausente ou de tipo inesperado: ${prop?.getClass()?.name}). " +
                    "A CatracaDeFusoUtc vai derrubar o arranque — e esta certa em fazer isso.")
    }
}

// ---------------------------------------------------------------------------
// `gradlew rodar` — sobe o jar empacotado com as flags certas.
//
// Existe para que o caminho normal de execucao nao dependa de alguem lembrar de
// digitar `-Duser.timezone=UTC`. Quem digitar `java -jar` na mao continua
// funcionando: a catraca recusa o arranque e a mensagem traz o comando pronto.
// ---------------------------------------------------------------------------
tasks.register('rodar', Exec) {
    group = 'application'
    description = 'Sobe o jar empacotado em UTC (depende de quarkusBuild)'
    dependsOn tasks.named('quarkusBuild')
    // `Exec`, e nao `JavaExec`: o quarkus-run.jar se localiza pelo proprio caminho
    // para achar `lib/`, entao ele precisa ser aberto com `-jar`, que nao e uma
    // classe principal. A primeira versao disto usava JavaExec com
    // `mainClass = '-jar'`; a tarefa REGISTRAVA sem erro e so quebrava ao rodar.
    commandLine "${System.getProperty('java.home')}/bin/java",
            '--enable-native-access=ALL-UNNAMED', FUSO_UTC,
            '-jar', layout.buildDirectory.file('quarkus-app/quarkus-run.jar').get().asFile.absolutePath
}

