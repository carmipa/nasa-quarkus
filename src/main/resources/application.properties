# =============================================================================
# nasa-quarkus — configuração
#
# REGRA DURA: nenhum valor de credencial mora aqui. Chave e senha entram por
# variável de ambiente, e este arquivo só declara o NOME da variável com um
# default seguro. O `.gitignore` bloqueia `application-local.properties` e
# `application-*.properties`; a guarda de segredos varre o conteúdo.
# =============================================================================

quarkus.application.name=nasa-quarkus
quarkus.http.port=8080

# -----------------------------------------------------------------------------
# Banco — PostgreSQL.
#
# POR QUE TROCAMOS (02/09/2026, decisão do Paulo): o destino é a VPS com
# usuários autenticados, e SQLite impede mais de um processo escrevendo. A troca
# custou 4 arquivos porque domínio e casos de uso nunca souberam qual banco
# existe — foi exatamente isso que a arquitetura de portas comprou.
#
# NENHUMA CREDENCIAL MORA NESTE ARQUIVO, e isso é por construção, não por
# disciplina:
#   - dev e teste  : Dev Services sobe um contêiner e gera credencial efêmera;
#   - produção     : só variável de ambiente, SEM valor padrão.
# Sem padrão é deliberado: subir com senha adivinhada é pior que não subir.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Conforto de desenvolvimento — abrir o navegador ao subir.
#
# Vale SOMENTE em dev: a classe que faz isso é `@IfBuildProfile("dev")` e nem
# entra no jar de produção. Na VPS, um processo de servidor tentando abrir
# navegador ficaria pendurado esperando algo que não existe.
#
# Ponha `false` para desligar sem mexer em código.
# -----------------------------------------------------------------------------
%dev.nasa.dev.abrir-navegador=true

quarkus.datasource.db-kind=postgresql

# Versão FIXA. `postgres:latest` faria a máquina de hoje e a de daqui a seis
# meses rodarem bancos diferentes, e a diferença apareceria como teste que
# "às vezes falha".
quarkus.datasource.devservices.image-name=postgres:17-alpine
# O REAPROVEITAMENTO DO CONTEINER E DECIDIDO POR PERFIL, e os dois perfis
# querem coisas opostas — por isso a configuracao e separada em vez de unica.
#
# TESTE: reuse=false, obrigatorio. Os testes de esquema usam chaves FIXAS, como
# 'EONET_DUP_1'. Com o banco sobrevivendo entre execucoes, eles passariam na
# primeira rodada e falhariam na segunda, com o insert inicial batendo na
# duplicata que ele mesmo deixou. E o mesmo isolamento que no SQLite se obtinha
# apagando o arquivo antes de cada suite: resultado que depende do que sobrou da
# rodada anterior nao prova nada sobre o presente.
%test.quarkus.datasource.devservices.reuse=false
#
# DESENVOLVIMENTO: reuse=true. Medido em 02/09/2026 — reiniciar o `quarkusDev`
# apagou o conteiner e com ele os 21.542 eventos historicos, que levaram varios
# minutos de chamadas a NASA para entrar. Perder a base a cada reinicio nao e
# isolamento, e trabalho jogado fora: quem esta desenvolvendo reinicia o
# servidor dez vezes por hora, e ressincronizar doze anos a cada vez torna a
# tela de historico impossivel de usar de verdade.
#
# As migracoes do Flyway sao idempotentes por checksum, entao o banco reusado
# nao reaplica o que ja rodou.
%dev.quarkus.datasource.devservices.reuse=true

# Produção: tudo por ambiente. Faltando qualquer uma, o arranque cai.
%prod.quarkus.datasource.jdbc.url=${NASA_DB_URL}
%prod.quarkus.datasource.username=${NASA_DB_USER}
%prod.quarkus.datasource.password=${NASA_DB_PASSWORD}

quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# A VPS reinicia serviços, e conexão morta no pool falha longe da causa. Com
# `db-kind=postgresql` o Agroal valida sozinho — ao contrário do `other` que o
# SQLite exigia, onde a validação tinha de ser escrita à mão.
quarkus.datasource.jdbc.background-validation-interval=2M

# -----------------------------------------------------------------------------
# Integrações externas — nenhuma delas carrega segredo neste arquivo.
#
# NASA EONET v3 é ABERTA: não usa api_key, só pede User-Agent identificando o
# projeto. Medido no cliente legado (gs/.../NasaEonetClient.java), que monta a
# URL sem nenhum parâmetro de chave.
# -----------------------------------------------------------------------------
nasa.eonet.api.url=https://eonet.gsfc.nasa.gov/api/v3/events
nasa.eonet.user-agent=nasa-quarkus/1.0 (projeto academico FIAP)

# -----------------------------------------------------------------------------
# CEP e geocodificação — 100% código aberto, sem credencial (ordem do Paulo,
# 2026-09-02: "usaremos alternativas de código aberto para a mesma função ou
# melhor"). O Google saiu do projeto inteiro; não há adaptador dele.
#
# Todos os números abaixo foram MEDIDOS em 2026-09-02, não estimados.
#
# 1º BrasilAPI CEP v2 — 297 bytes em 0,23 s, e devolve endereço + coordenada +
#    IBGE + fuso na MESMA chamada. É o "ou melhor" do pedido: o legado gastava
#    duas chamadas (ViaCEP para o endereço, Google para a coordenada) e agora
#    basta uma.
# 2º Nominatim (OSM) — 826 bytes em 0,82 s, com `/reverse` em 0,39 s.
#
# ⚠️ A coordenada da BrasilAPI NÃO é garantida: em amostra de 6 CEPs, 5 vieram
#    com `location` e 1 veio SEM (69900000, servido pelo provedor `correios`).
#    Por isso o Nominatim é degradação declarada, não enfeite — e coordenada
#    ausente é ausente, nunca 0,0 (o "null island" fica no Golfo da Guiné e
#    poria o endereço do cliente no oceano sem nenhum erro aparecer).
# -----------------------------------------------------------------------------
cep.brasilapi.url=https://brasilapi.com.br/api/cep/v2
cep.viacep.url=https://viacep.com.br/ws

geocodificacao.provedor=brasilapi-com-fallback-nominatim
geocodificacao.nominatim.url=https://nominatim.openstreetmap.org
geocodificacao.photon.url=https://photon.komoot.io/api

# A política de uso do Nominatim público exige User-Agent identificável e no
# máximo 1 requisição por segundo. Não é sugestão: quem ignora leva bloqueio de
# IP. O limite mora aqui e é honrado pelo adaptador, com cache antes dele.
geocodificacao.nominatim.limite-req-por-segundo=1
geocodificacao.nominatim.user-agent=${nasa.eonet.user-agent}

# Atribuição obrigatória pela licença ODbL do OpenStreetMap — tem de aparecer na
# tela do mapa, não só no código.
geocodificacao.atribuicao=© OpenStreetMap contributors (ODbL)

# -----------------------------------------------------------------------------
# LOG — um arquivo por EXECUÇÃO (§9 da planta canônica)
#
# "Log de execuções misturadas responde errado." Auditar uma funcionalidade pelo
# log único já deu três resultados errados no mesmo dia no projeto de origem.
#
# `file.enable=true` NÃO é redundante: sem esta linha o handler não sobe, e
# `path` + `rotation` sozinhos não escrevem nada. A aplicação fica gravando log
# nenhum, em silêncio — cicatriz de 50 minutos medida na origem.
#
# O carimbo `nasa.log.execucao` é gerado no LANÇAMENTO (build.gradle) e respeita
# valor vindo de fora (`-Dnasa.log.execucao=...`), para reproduzir uma execução
# antiga sem sobrescrever o log dela.
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.nasa".level=DEBUG

quarkus.log.file.enabled=true
quarkus.log.file.path=logs/execucoes/nasa-${nasa.log.execucao:manual}.log

# Rotação DESLIGADA de propósito: o arquivo já é único por execução, e o hot
# reload fragmentaria o log DA MESMA run em pedaços que ninguém consegue casar.
# `rotate-on-boot` precisa ser false pelo mesmo motivo — ele renomearia o arquivo
# desta execução ao subir.
quarkus.log.file.rotation.max-file-size=1G
quarkus.log.file.rotation.max-backup-index=0
quarkus.log.file.rotation.rotate-on-boot=false

# O formato do §9.2: instante ISO · nível · [execucaoId] · [origem] · mensagem.
# `execucaoId` é o mesmo carimbo do nome do arquivo — é ele que correlaciona a
# linha com ESTA run. A origem (`%c`) carrega o pacote, e o pacote carrega o nome
# da fatia: dá para `grep` por caso de uso sem conhecer nome de classe.
# Os campos `operacao`, `alvo=` e `(duracao)` entram pela mensagem, montada por
# `org.nasa.core.log.Registro` — mecanismo, não convenção.
quarkus.log.file.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [${nasa.log.execucao:manual}] [%c{2.}] %s%e%n
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n

# Faxina: a pasta não cresce sem fim. Ela é EXCLUSIVA de log — faxina apontada
# para pasta com outras coisas apaga as outras coisas.
nasa.log.pasta=logs/execucoes
nasa.log.manter-execucoes=200

%test.quarkus.log.file.path=build/logs-teste/nasa-${nasa.log.execucao:teste}.log
%test.nasa.log.pasta=build/logs-teste

# Telemetria por fatia (§10.2): a porta é da FATIA, o arquivo é dela também.
nasa.telemetria.arquivo.endereco=logs/telemetria_endereco.json
%test.nasa.telemetria.arquivo.endereco=build/telemetria-teste/telemetria_endereco.json

# Retenção de log: 30 dias (ordem de Paulo, 02/09) + teto de segurança por
# contagem. Idade sozinha não limita nada quando há muitas execuções por dia.
nasa.log.manter-dias=30
%test.nasa.log.manter-dias=1
