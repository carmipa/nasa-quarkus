# ------------------------------------------------------------
# desastres.carminati.dev.br  ->  nasa-desastres:8080
#
# ESTE ARQUIVO E ESCRITO A MAO, e nao gerado pela interface do NPM.
#
# Por que: publicar pela interface exige a senha do admin, que eu nao tenho. O
# banco do NPM serve outros tres sites de producao (frameworknet, challengepride,
# binmapper) e escrever nele direto arriscaria os tres para ganhar um. Um arquivo
# novo em `proxy_host/` e incluido pelo mesmo `include` que os gerados, nao toca
# em linha nenhuma do banco, e sai com um `rm`.
#
# O NUMERO 900 E DE PROPOSITO. O NPM gera 1.conf, 2.conf, 3.conf, 100.conf a
# partir dos ids do banco dele. Um id que ele venha a gerar NUNCA vai chegar a
# 900 tao cedo — e se chegasse, ele sobrescreveria este arquivo e o dominio
# cairia sem ninguem entender por que. Numero alto e a folga que evita isso.
#
# CONSEQUENCIA QUE PRECISA FICAR ESCRITA: como o NPM nao sabe deste host, a
# RENOVACAO AUTOMATICA DELE NAO COBRE ESTE CERTIFICADO. Sem o cron do
# `renovar-cert-desastres.sh`, ele vence em 2026-12-02 e o dominio cai com erro
# de TLS, calado. E exatamente o motivo pelo qual `renovar-cert-aspm.sh` e
# `renovar-cert-carminati-fst.sh` ja existem nesta maquina.
# ------------------------------------------------------------

server {
  set $forward_scheme http;
  set $server         "nasa-desastres";
  set $port           8080;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name desastres.carminati.dev.br;
  http2 off;

  # O desafio do ACME vem ANTES de qualquer redirecionamento. Um `return 301`
  # que engole tudo faz a renovacao falhar — e a descoberta viria noventa dias
  # depois, com o certificado vencido e o site fora do ar.
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate     /etc/letsencrypt/live/desastres/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/desastres/privkey.pem;

  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-900_access.log proxy;
  error_log  /data/logs/proxy-host-900_error.log warn;

  # FORCE SSL. Fica DEPOIS do include do ACME, de proposito — a ordem e o que
  # mantem a renovacao viva.
  if ($scheme = "http") {
    return 301 https://$host$request_uri;
  }

  # HSTS sem `includeSubDomains` e sem `preload`. Ha outros subdominios de
  # carminati.dev.br nesta mesma maquina, e um deles em HTTP puro ficaria
  # inacessivel para quem visitasse este primeiro — o navegador passaria a
  # exigir HTTPS de TODOS. `preload` e pior: entra numa lista embutida nos
  # navegadores, e sair dela leva meses.
  add_header Strict-Transport-Security "max-age=63072000" always;

  # TELEMETRIA FORA DO AR PUBLICO, por decisao do Paulo em 03/09: o deploy sobe
  # sem autenticacao e o login do GitHub fica para uma segunda etapa.
  #
  # 404 e nao 403: `403` CONFIRMA que a rota existe e esta protegida, o que e
  # informacao para quem procura superficie. `404` nao diz nada.
  #
  # ISTO NAO E AUTORIZACAO, e nao pretende ser: e uma tapa-buraco honesta ate o
  # login existir. Quem precisar ver a telemetria enquanto isso usa um tunel:
  #     ssh -L 18083:127.0.0.1:18083 vps-paulo
  #     e abre http://127.0.0.1:18083/telemetria
  # Quando o login entrar, ESTE BLOCO SAI.
  location /telemetria {
    return 404;
  }

  location / {
    # Os quatro cabecalhos sao o contrato com
    # `quarkus.http.proxy.proxy-address-forwarding=true` na aplicacao. Sem eles
    # o Quarkus ve toda requisicao vindo do proxy em `http`: a telemetria
    # registraria o proxy como cliente de tudo, e qualquer redirecionamento que
    # o framework montasse sairia apontando para o endereco interno.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $cvi_conn_upgrade;

    # A sincronizacao com a EONET passa de um minuto em rede ruim, e o padrao
    # de 60s cortaria a resposta no meio — o cliente veria 504 sobre uma
    # operacao que terminou bem no servidor.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_pass $forward_scheme://$server:$port;
  }
}
