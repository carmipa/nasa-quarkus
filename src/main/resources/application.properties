# =============================================================================
# nasa-quarkus — configuração
#
# REGRA DURA: nenhum valor de credencial mora aqui. Chave e senha entram por
# variável de ambiente, e este arquivo só declara o NOME da variável com um
# default seguro. O `.gitignore` bloqueia `application-local.properties` e
# `application-*.properties`; a guarda de segredos varre o conteúdo.
# =============================================================================

quarkus.application.name=nasa-quarkus
quarkus.http.port=8080

# -----------------------------------------------------------------------------
# Banco — SQLite via driver JDBC comum sob o Agroal.
# O SQLite não é extensão oficial do Quarkus, por isso `db-kind=other` com
# driver explícito. Viabilidade medida por SqliteViabilidadeTest.
#
# `foreign_keys=ON` é obrigatório e vem por conexão: no SQLite a integridade
# referencial nasce DESLIGADA. Sem isso as FKs do modelo são decorativas — e o
# defeito só aparece quando o dado já está inconsistente.
# `busy_timeout` evita que escrita concorrente devolva SQLITE_BUSY na cara do
# operador; WAL dá leitores concorrentes com um escritor.
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${NASA_DB_PATH:data/nasa.db}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
quarkus.datasource.jdbc.max-size=8

# O SQLite serializa escrita. Uma única conexão de escrita evita SQLITE_BUSY em
# vez de remediá-lo depois; leitura escala por WAL.
quarkus.datasource.jdbc.min-size=1

# MEDIDO no arranque do SqliteViabilidadeTest, e é um aviso com consequência:
#   "Agroal does not support detecting if a connection is still usable after an
#    exception for database kind: other"
# Traduzindo: conexão quebrada por exceção volta ao pool e o pool NÃO sabe que ela
# está ruim — o próximo pedido pega uma conexão morta e a falha aparece longe da
# causa. Como o Agroal não detecta sozinho neste db-kind, a validação passa a ser
# explícita: toda conexão é testada antes de ser entregue.
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.foreground-validation-interval=0S
quarkus.datasource.jdbc.background-validation-interval=2M

%test.quarkus.datasource.jdbc.url=jdbc:sqlite:${NASA_DB_PATH:build/teste-nasa.db}?foreign_keys=on&busy_timeout=5000

# -----------------------------------------------------------------------------
# Integrações externas — nenhuma delas carrega segredo neste arquivo.
#
# NASA EONET v3 é ABERTA: não usa api_key, só pede User-Agent identificando o
# projeto. Medido no cliente legado (gs/.../NasaEonetClient.java), que monta a
# URL sem nenhum parâmetro de chave.
# -----------------------------------------------------------------------------
nasa.eonet.api.url=https://eonet.gsfc.nasa.gov/api/v3/events
nasa.eonet.user-agent=nasa-quarkus/1.0 (projeto academico FIAP)

# -----------------------------------------------------------------------------
# CEP e geocodificação — 100% código aberto, sem credencial (ordem do Paulo,
# 2026-09-02: "usaremos alternativas de código aberto para a mesma função ou
# melhor"). O Google saiu do projeto inteiro; não há adaptador dele.
#
# Todos os números abaixo foram MEDIDOS em 2026-09-02, não estimados.
#
# 1º BrasilAPI CEP v2 — 297 bytes em 0,23 s, e devolve endereço + coordenada +
#    IBGE + fuso na MESMA chamada. É o "ou melhor" do pedido: o legado gastava
#    duas chamadas (ViaCEP para o endereço, Google para a coordenada) e agora
#    basta uma.
# 2º Nominatim (OSM) — 826 bytes em 0,82 s, com `/reverse` em 0,39 s.
#
# ⚠️ A coordenada da BrasilAPI NÃO é garantida: em amostra de 6 CEPs, 5 vieram
#    com `location` e 1 veio SEM (69900000, servido pelo provedor `correios`).
#    Por isso o Nominatim é degradação declarada, não enfeite — e coordenada
#    ausente é ausente, nunca 0,0 (o "null island" fica no Golfo da Guiné e
#    poria o endereço do cliente no oceano sem nenhum erro aparecer).
# -----------------------------------------------------------------------------
cep.brasilapi.url=https://brasilapi.com.br/api/cep/v2
cep.viacep.url=https://viacep.com.br/ws

geocodificacao.provedor=brasilapi-com-fallback-nominatim
geocodificacao.nominatim.url=https://nominatim.openstreetmap.org
geocodificacao.photon.url=https://photon.komoot.io/api

# A política de uso do Nominatim público exige User-Agent identificável e no
# máximo 1 requisição por segundo. Não é sugestão: quem ignora leva bloqueio de
# IP. O limite mora aqui e é honrado pelo adaptador, com cache antes dele.
geocodificacao.nominatim.limite-req-por-segundo=1
geocodificacao.nominatim.user-agent=${nasa.eonet.user-agent}

# Atribuição obrigatória pela licença ODbL do OpenStreetMap — tem de aparecer na
# tela do mapa, não só no código.
geocodificacao.atribuicao=© OpenStreetMap contributors (ODbL)

# -----------------------------------------------------------------------------
# Log
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.nasa".level=DEBUG
