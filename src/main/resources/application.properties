# =============================================================================
# nasa-quarkus — configuração
#
# REGRA DURA: nenhum valor de credencial mora aqui. Chave e senha entram por
# variável de ambiente, e este arquivo só declara o NOME da variável com um
# default seguro. O `.gitignore` bloqueia `application-local.properties` e
# `application-*.properties`; a guarda de segredos varre o conteúdo.
# =============================================================================

quarkus.application.name=nasa-quarkus
quarkus.http.port=8080

# -----------------------------------------------------------------------------
# Banco — PostgreSQL.
#
# POR QUE TROCAMOS (02/09/2026, decisão do Paulo): o destino é a VPS com
# usuários autenticados, e SQLite impede mais de um processo escrevendo. A troca
# custou 4 arquivos porque domínio e casos de uso nunca souberam qual banco
# existe — foi exatamente isso que a arquitetura de portas comprou.
#
# NENHUMA CREDENCIAL MORA NESTE ARQUIVO, e isso é por construção, não por
# disciplina:
#   - dev e teste  : Dev Services sobe um contêiner e gera credencial efêmera;
#   - produção     : só variável de ambiente, SEM valor padrão.
# Sem padrão é deliberado: subir com senha adivinhada é pior que não subir.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Conforto de desenvolvimento — abrir o navegador ao subir.
#
# Vale SOMENTE em dev: a classe que faz isso é `@IfBuildProfile("dev")` e nem
# entra no jar de produção. Na VPS, um processo de servidor tentando abrir
# navegador ficaria pendurado esperando algo que não existe.
#
# Ponha `false` para desligar sem mexer em código.
# -----------------------------------------------------------------------------
%dev.nasa.dev.abrir-navegador=true

# SQLite via driver JDBC comum sob o Agroal. `db-kind=other` porque o SQLite NAO
# e extensao oficial do Quarkus — o driver e declarado explicitamente.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

# =============================================================================
# POR QUE SQLITE, E O QUE ISSO CUSTOU — decisao do Paulo, 03/09/2026
#
# O projeto esteve em PostgreSQL. A volta foi decidida por PORTABILIDADE: com
# SQLite o sistema roda com uma JVM e nada mais — sem daemon, sem imagem, sem
# espera de conteiner. `git clone && ./gradlew quarkusDev` funciona.
#
# A CONTA FOI MEDIDA antes de decidir, e nao era a esperada:
#   construcoes que o SQLite MODERNO faz ............ 20
#     FILTER(WHERE) 3.30+ · ON CONFLICT 3.24+ · RETURNING 3.35+
#     LEAST/GREATEST -> MIN/MAX · date_trunc/EXTRACT -> substr da string ISO
#   construcoes que ele NAO faz ..................... 15
#     TIMESTAMPTZ (11) · AT TIME ZONE (3) · xmax=0 (1)
#
# O QUE SE PERDEU, DECLARADO: o SQLite nao tem tipo de data. A disciplina de UTC
# vivia no TIPO da coluna, e tipo e mecanismo — nao depende de ninguem lembrar.
#
# O QUE SUBSTITUIU: instante vira TEXTO ISO-8601 terminado em `Z`, e o esquema
# tem CHECK exigindo o `Z` em toda coluna de instante. Continua sendo mecanismo
# do banco: gravacao em hora local e RECUSADA, nao aceita em silencio. A largura
# fixa faz a ordem alfabetica coincidir com a cronologica, entao ORDER BY, MIN e
# MAX seguem corretos sem funcao de data. Ver `InstanteEmTexto`.
#
# O `xmax = 0`, que dizia se o upsert inseriu ou atualizou, virou a comparacao
# `criado_em = sincronizado_em` — e a solucao ficou melhor: `criado_em` e dado de
# negocio, responde "desde quando conhecemos este evento", e nao depende de
# detalhe interno de motor nenhum.
# =============================================================================

# Os parametros vao NA URL, e nao em `additional-jdbc-properties`: o driver do
# SQLite os aplica por CONEXAO, e o Agroal abre varias.
#
#   foreign_keys=on  — a integridade referencial nasce DESLIGADA no SQLite. Sem
#                      isto as chaves estrangeiras do esquema sao decorativas.
#   busy_timeout     — o padrao e ZERO: a primeira concorrencia viraria erro
#                      imediato em vez de espera.
#   journal_mode=WAL — leitor nao bloqueia escritor. Sem isto, abrir a tela de
#                      desastres durante a sincronizacao daria "database is
#                      locked", que o SQLite devolve como ERRO.
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:${NASA_DB_PATH:data/nasa.db}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:build/teste-nasa.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
%prod.quarkus.datasource.jdbc.url=jdbc:sqlite:${NASA_DB_PATH}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL

# ---------------------------------------------------------------------------
# O ENDERECO PUBLICO — o que as etiquetas de previa de link anunciam.
#
# `og:image`, `og:url` e `twitter:image` precisam de URL ABSOLUTA: quando
# alguem cola o link no WhatsApp, no LinkedIn ou no Slack, o servidor DELES vai
# buscar a imagem, e um caminho relativo nao resolve de fora. Com o padrao de
# desenvolvimento, a previa apontaria para `http://localhost:8080` — que na
# maquina de quem recebeu o link e a maquina de quem recebeu o link.
#
# Fica em `%prod` e nao no valor padrao de proposito: em desenvolvimento o
# certo E `localhost`, e um padrao global com o dominio real faria a maquina de
# desenvolvimento anunciar imagens de producao.
%prod.nasa.endereco-publico=https://desastres.carminati.dev.br

# ---------------------------------------------------------------------------
# ATRAS DE PROXY REVERSO — as duas linhas que faltavam para o deploy.
#
# 1. QUEM RESTRINGE O ENDERECO E O DOCKER, NAO ESTA CHAVE.
#
# Eu tinha escrito aqui `%prod.quarkus.http.host=127.0.0.1`, raciocinando que o
# padrao `0.0.0.0` exporia a porta 8080 a internet. O raciocinio vale para um
# processo solto na maquina e ESTA ERRADO para este deploy, que e um container:
# dentro dele, `127.0.0.1` e o laco do PROPRIO container, e o `docker-proxy` que
# repassa de fora nao alcancaria a aplicacao. O site simplesmente nao subiria.
#
# Quem restringe de verdade e o mapeamento de porta, no docker-compose:
#
#     ports: ["127.0.0.1:18083:8080"]
#
# O `127.0.0.1` ali e o da VPS, e e ele que faz a porta ser inalcancavel de fora
# — so o NPM, que esta na mesma rede docker, chega. O Dockerfile fixa
# `-Dquarkus.http.host=0.0.0.0` por isso, e esta certo.
#
# A chave fica FORA daqui de proposito: configuracao que o Dockerfile precisa
# sobrepor toda vez e configuracao que mente sobre o que acontece.

# 2. CONFIAR NOS CABECALHOS DO PROXY.
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# O SQLite SERIALIZA escrita. Poucas conexoes evitam SQLITE_BUSY em vez de
# remedia-lo depois; a leitura escala pelo WAL.
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1

# MEDIDO no arranque, e e um aviso com consequencia: o Agroal nao consegue
# detectar sozinho se uma conexao SQLite continua utilizavel depois de um erro.
# Sem validacao explicita, uma conexao morta e entregue e a proxima consulta
# falha por um motivo que nao tem nada a ver com ela.
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.foreground-validation-interval=0S
quarkus.datasource.jdbc.background-validation-interval=2M


# -----------------------------------------------------------------------------
# Integrações externas — nenhuma delas carrega segredo neste arquivo.
#
# NASA EONET v3 é ABERTA: não usa api_key, só pede User-Agent identificando o
# projeto. Medido no cliente legado (gs/.../NasaEonetClient.java), que monta a
# URL sem nenhum parâmetro de chave.
# -----------------------------------------------------------------------------
nasa.eonet.api.url=https://eonet.gsfc.nasa.gov/api/v3/events
nasa.eonet.user-agent=nasa-quarkus/1.0 (projeto academico FIAP)

# -----------------------------------------------------------------------------
# CEP e geocodificação — 100% código aberto, sem credencial (ordem do Paulo,
# 2026-09-02: "usaremos alternativas de código aberto para a mesma função ou
# melhor"). O Google saiu do projeto inteiro; não há adaptador dele.
#
# Todos os números abaixo foram MEDIDOS em 2026-09-02, não estimados.
#
# 1º BrasilAPI CEP v2 — 297 bytes em 0,23 s, e devolve endereço + coordenada +
#    IBGE + fuso na MESMA chamada. É o "ou melhor" do pedido: o legado gastava
#    duas chamadas (ViaCEP para o endereço, Google para a coordenada) e agora
#    basta uma.
# 2º Nominatim (OSM) — 826 bytes em 0,82 s, com `/reverse` em 0,39 s.
#
# ⚠️ A coordenada da BrasilAPI NÃO é garantida: em amostra de 6 CEPs, 5 vieram
#    com `location` e 1 veio SEM (69900000, servido pelo provedor `correios`).
#    Por isso o Nominatim é degradação declarada, não enfeite — e coordenada
#    ausente é ausente, nunca 0,0 (o "null island" fica no Golfo da Guiné e
#    poria o endereço do cliente no oceano sem nenhum erro aparecer).
# -----------------------------------------------------------------------------
cep.brasilapi.url=https://brasilapi.com.br/api/cep/v2
cep.viacep.url=https://viacep.com.br/ws

geocodificacao.provedor=brasilapi-com-fallback-nominatim
geocodificacao.nominatim.url=https://nominatim.openstreetmap.org
geocodificacao.photon.url=https://photon.komoot.io/api

# A política de uso do Nominatim público exige User-Agent identificável e no
# máximo 1 requisição por segundo. Não é sugestão: quem ignora leva bloqueio de
# IP. O limite mora aqui e é honrado pelo adaptador, com cache antes dele.
geocodificacao.nominatim.limite-req-por-segundo=1
geocodificacao.nominatim.user-agent=${nasa.eonet.user-agent}

# Atribuição obrigatória pela licença ODbL do OpenStreetMap — tem de aparecer na
# tela do mapa, não só no código.
geocodificacao.atribuicao=© OpenStreetMap contributors (ODbL)

# -----------------------------------------------------------------------------
# LOG — um arquivo por EXECUÇÃO (§9 da planta canônica)
#
# "Log de execuções misturadas responde errado." Auditar uma funcionalidade pelo
# log único já deu três resultados errados no mesmo dia no projeto de origem.
#
# `file.enable=true` NÃO é redundante: sem esta linha o handler não sobe, e
# `path` + `rotation` sozinhos não escrevem nada. A aplicação fica gravando log
# nenhum, em silêncio — cicatriz de 50 minutos medida na origem.
#
# O carimbo `nasa.log.execucao` é gerado no LANÇAMENTO (build.gradle) e respeita
# valor vindo de fora (`-Dnasa.log.execucao=...`), para reproduzir uma execução
# antiga sem sobrescrever o log dela.
# -----------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.nasa".level=DEBUG

quarkus.log.file.enabled=true
quarkus.log.file.path=logs/execucoes/nasa-${nasa.log.execucao:manual}.log

# Rotação DESLIGADA de propósito: o arquivo já é único por execução, e o hot
# reload fragmentaria o log DA MESMA run em pedaços que ninguém consegue casar.
# `rotate-on-boot` precisa ser false pelo mesmo motivo — ele renomearia o arquivo
# desta execução ao subir.
quarkus.log.file.rotation.max-file-size=1G
quarkus.log.file.rotation.max-backup-index=0
quarkus.log.file.rotation.rotate-on-boot=false

# O formato do §9.2: instante ISO · nível · [execucaoId] · [origem] · mensagem.
# `execucaoId` é o mesmo carimbo do nome do arquivo — é ele que correlaciona a
# linha com ESTA run. A origem (`%c`) carrega o pacote, e o pacote carrega o nome
# da fatia: dá para `grep` por caso de uso sem conhecer nome de classe.
# Os campos `operacao`, `alvo=` e `(duracao)` entram pela mensagem, montada por
# `org.nasa.core.log.Registro` — mecanismo, não convenção.
quarkus.log.file.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [${nasa.log.execucao:manual}] [%c{2.}] %s%e%n
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n

# Faxina: a pasta não cresce sem fim. Ela é EXCLUSIVA de log — faxina apontada
# para pasta com outras coisas apaga as outras coisas.
nasa.log.pasta=logs/execucoes
nasa.log.manter-execucoes=200

%test.quarkus.log.file.path=build/logs-teste/nasa-${nasa.log.execucao:teste}.log
%test.nasa.log.pasta=build/logs-teste

# Telemetria por fatia (§10.2): a porta é da FATIA, o arquivo é dela também.
nasa.telemetria.arquivo.endereco=logs/telemetria_endereco.json
%test.nasa.telemetria.arquivo.endereco=build/telemetria-teste/telemetria_endereco.json

# Retenção de log: 30 dias (ordem de Paulo, 02/09) + teto de segurança por
# contagem. Idade sozinha não limita nada quando há muitas execuções por dia.
nasa.log.manter-dias=30
%test.nasa.log.manter-dias=1

# =============================================================================
# LOGIN COM GITHUB — e o que fica fechado
#
# OAuth2 do GitHub, nao OIDC de verdade: o GitHub NAO emite `id_token` nem tem
# documento de descoberta. O preset `provider=github` existe exatamente para
# isso — desliga a descoberta e a exigencia de id_token, e identifica a pessoa
# pelo `/user` da API.
# =============================================================================
# ---------------------------------------------------------------------------
# O LOGIN NASCE DESLIGADO, e acende com uma variavel.
#
# O OAuth App do GitHub ainda nao existe — decisao do Paulo em 03/09: o deploy
# sobe sem autenticacao e o login vem numa segunda etapa. Sem esta chave, o
# Quarkus RECUSA O ARRANQUE quando falta `client-id`, e o site inteiro ficaria
# fora do ar esperando uma credencial que so protege UMA tela.
#
# Para acender, no `.env` da VPS (600, fora do git):
#     OIDC_LIGADO=true
#     GITHUB_CLIENT_ID=...
#     GITHUB_CLIENT_SECRET=...
# e `docker compose up -d`. Nada mais muda.
#
# ENQUANTO ESTIVER DESLIGADO, quem barra `/telemetria` sao DUAS coisas: a
# politica `authenticated` abaixo, que sem autenticador recusa todo mundo com
# 401, e o `return 404` no proxy. Nenhuma das duas e autorizacao de verdade —
# sao tranca de porta ate a fechadura chegar.
%prod.quarkus.oidc.enabled=${OIDC_LIGADO:false}
%prod.quarkus.oidc.provider=github

# O valor de reserva existe SO para o arranque nao quebrar com o login
# desligado. Com `OIDC_LIGADO=false` ele nunca e usado; com `true` sem a
# variavel, o GitHub recusa o `client_id` e o erro aparece na hora do login —
# que e o lugar certo para ele aparecer.
%prod.quarkus.oidc.client-id=${GITHUB_CLIENT_ID:oauth-app-ainda-nao-criado}
%prod.quarkus.oidc.credentials.secret=${GITHUB_CLIENT_SECRET:oauth-app-ainda-nao-criado}

%prod.quarkus.oidc.authentication.redirect-path=/login/github/retorno
%prod.quarkus.oidc.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.authentication.cookie-path=/

# O GitHub recusa o escopo `openid` — ele nao e um provedor OIDC.
%prod.quarkus.oidc.authentication.add-openid-scope=false

# Em dev e teste a extensao sai do build: sem isto, `quarkusDev` exigiria
# credencial do GitHub para abrir qualquer tela, e a suite de testes tambem.
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

# -----------------------------------------------------------------------------
# O QUE EXIGE LOGIN: SO A TELEMETRIA.
#
# A PRIMEIRA VERSAO DISTO ESTAVA INVERTIDA, e o efeito era grande. Ela declarava
# uma lista de rotas publicas e fechava `/*`, o que punha ATRAS DE LOGIN:
#
#   /desastres, /desastres/mapa, /alertas ... a funcao principal da vitrine
#   /saude ................................. quebrando o healthcheck do container
#   /sitemap.xml ........................... o Google nao consegue ler
#
# O pedido do Paulo era o oposto, e literal: "ja crio a chave do git para
# qualquer pessoa autenticar, SO A TELEMETRIA que bloqueamos para uso pessoal".
#
# POR QUE LISTA DE NEGACAO, E NAO DE PERMISSAO. A regra geral e "vitrine e
# publica": listar o que e publico obrigaria a lembrar de cada rota nova, e a
# que fosse esquecida ficaria atras de login sem ninguem entender por que — foi
# o que aconteceu com `/saude`. Aqui o padrao e o certo para este sistema, e a
# excecao e uma linha so.
#
# O RISCO DESTA ESCOLHA, declarado: uma rota sensivel nova nasce PUBLICA. Isso e
# aceitavel porque nao ha dado pessoal no sistema — nao ha cadastro, e o alerta
# nao grava nada. No dia em que houver, esta decisao precisa ser revista, e e
# por isso que ela esta escrita aqui e nao so no commit.
# -----------------------------------------------------------------------------
quarkus.http.auth.permission.telemetria.paths=/telemetria,/telemetria/*
quarkus.http.auth.permission.telemetria.policy=authenticated

# Em dev nao ha autenticador nenhum (`oidc.enabled=false`), entao a politica
# `authenticated` recusaria a tela para todo mundo, inclusive para quem esta
# desenvolvendo ela.
%dev.quarkus.http.auth.permission.telemetria.policy=permit
%test.quarkus.http.auth.permission.telemetria.policy=permit
