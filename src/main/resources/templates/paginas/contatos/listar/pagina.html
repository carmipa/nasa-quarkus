{#include layout/base}
{#titulo}Contatos{/titulo}

{#estilos}
<link rel="stylesheet" href="/paginas/contatos/listar/estilo.css?v={versaoAssets}">
{/estilos}

{#corpo}
<!--
  LISTA DE CONTATOS.

  A DECISAO QUE ESTA TELA PRECISA DEIXAR CLARA e uma so: este contato recebe
  alerta de desastre? So o tipo EMERGENCIA recebe. No legado nada dizia isso, e
  dava para cadastrar um contato achando que a cobertura existia — a descoberta
  vinha no dia do evento.
-->
<section class="secao">
  <div class="lista-topo">
    <h1 class="secao-titulo com-icone">{#icone 'contatos' /}Contatos</h1>
    <span class="lista-total" translate="no">{total} cadastrado{#if total != 1}s{/if}</span>
    <a class="botao botao-principal com-icone" href="/contatos/cadastrar">{#icone 'adicionar' /}Novo contato</a>
  </div>

  <form class="filtros"
        hx-get="/contatos/fragmento/lista"
        hx-target="#lista"
        hx-trigger="submit, keyup changed delay:300ms from:#termo, change from:#tipo"
        hx-indicator="#buscando">
    <div class="filtro">
      <label class="formulario-rotulo dica" for="termo" data-dica="Procura dentro do e-mail e dos telefones. Parte do texto já encontra.">Buscar por e-mail ou telefone</label>
      <input class="campo-formulario" id="termo" name="termo" type="search"
             autocomplete="off" placeholder="Digite para filtrar…">
    </div>
    <div class="filtro">
      <label class="formulario-rotulo dica" for="tipo" data-dica="Mostra só os contatos de um tipo. Em branco, mostra todos.">Tipo</label>
      <select class="campo-formulario" id="tipo" name="tipo">
        <option value="">Todos</option>
        <option value="EMERGENCIA">Emergência (recebe alerta)</option>
        <option value="PRINCIPAL">Principal</option>
        <option value="ALTERNATIVO">Alternativo</option>
        <option value="COMERCIAL">Comercial</option>
      </select>
    </div>
    <div class="filtros-acoes">
      <button class="botao com-icone" type="submit">{#icone 'filtrar' /}Filtrar</button>
      <span class="htmx-indicator carregando" id="buscando" translate="no">buscando…</span>
    </div>
  </form>

  <div id="lista" hx-get="/contatos/fragmento/lista" hx-trigger="load" hx-target="this">
    <p class="vazio">Carregando…</p>
  </div>
</section>
{/corpo}
{/include}
